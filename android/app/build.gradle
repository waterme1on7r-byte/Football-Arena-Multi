plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.footballarena.mobile'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    defaultConfig {
        applicationId 'app.footballarena.mobile'
        minSdk 23
        targetSdk 35
        versionCode 1802
        versionName '1.8.2-android-preview'
    }
}
