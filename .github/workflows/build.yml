name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.11.1
      - name: Build Android and Android TV APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: football-arena-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install
      - name: Check language migration and catalogs
        run: node tests/localization.cjs
      # Normal run (push to main / manual): just build the installer, nothing is published.
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: football-arena-installer
          path: dist/*.exe
      # Release run (a tag like v1.8.0 that matches "version" in package.json): builds AND publishes the GitHub Release
      # (installer + latest.yml). Installed apps find it, download it in the background and offer "Restart now".
      - if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  macos:
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Use upstream's signed-off release binaries. Building from source with
      # CGO disabled omits Darwin's pcap declarations and fails with undefined pcap* symbols.
      - name: Fetch SpoofDPI v1.5.5 for both Mac CPUs
        shell: bash
        run: |
          mkdir -p spoofdpi/x64 spoofdpi/arm64
          base="https://github.com/xvzc/spoofdpi/releases/download/v1.5.5"
          curl -fL "$base/spoofdpi_1.5.5_darwin_x86_64.tar.gz" -o "$RUNNER_TEMP/spoofdpi-x64.tar.gz"
          curl -fL "$base/spoofdpi_1.5.5_darwin_arm64.tar.gz" -o "$RUNNER_TEMP/spoofdpi-arm64.tar.gz"
          mkdir -p "$RUNNER_TEMP/spoofdpi-x64" "$RUNNER_TEMP/spoofdpi-arm64"
          tar -xzf "$RUNNER_TEMP/spoofdpi-x64.tar.gz" -C "$RUNNER_TEMP/spoofdpi-x64"
          tar -xzf "$RUNNER_TEMP/spoofdpi-arm64.tar.gz" -C "$RUNNER_TEMP/spoofdpi-arm64"
          x64bin="$(find "$RUNNER_TEMP/spoofdpi-x64" -type f -name spoofdpi -print -quit)"
          arm64bin="$(find "$RUNNER_TEMP/spoofdpi-arm64" -type f -name spoofdpi -print -quit)"
          test -n "$x64bin" && test -n "$arm64bin"
          cp "$x64bin" spoofdpi/x64/spoofdpi
          cp "$arm64bin" spoofdpi/arm64/spoofdpi
          chmod +x spoofdpi/x64/spoofdpi spoofdpi/arm64/spoofdpi
      - run: npm install
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:mac
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: football-arena-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
