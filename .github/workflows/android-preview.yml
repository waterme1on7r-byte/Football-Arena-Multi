name: Android preview and native UI checks
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.11.1
      - name: Build APK and test DNS and proxy routing
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android 13 tablet layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_c
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1920x1200
            adb shell wm density 160
            gradle -p android connectedDebugAndroidTest
            adb pull /sdcard/Android/data/app.footballarena.mobile/files/ui-check ui-check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-preview-and-checks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            ui-check/
      - name: Publish Android preview only
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Football-Arena-Android-1.8.12.apk
          zip -r android-ui-checks.zip ui-check
          gh release create "$GITHUB_REF_NAME" Football-Arena-Android-1.8.12.apk android-ui-checks.zip --prerelease --latest=false --title "Android 1.8.12 preview" --notes "Android-only: compact pane controls, responsive address bars, content-sized dark/gold dialogs, flag language picker, and TLS handshake fallback. Desktop releases are unchanged."
