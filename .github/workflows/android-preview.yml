name: Android preview and native UI checks
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Android tag to publish after successful checks
        required: false
        default: ''
  push:
    tags: ['android-v*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.11.1
      - name: Build APK and test DNS and proxy routing
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android 13 tablet layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_c
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1920x1200
            adb shell wm density 240
            gradle -p android connectedDebugAndroidTest
            adb pull /data/local/tmp/football-arena-ui ui-check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-preview-and-checks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            ui-check/
      - name: Publish Android preview only
        if: startsWith(github.ref, 'refs/tags/android-v') || startsWith(inputs.release_tag, 'android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | sed 's/-android-preview//')"
          apk="Football-Arena-Android-$version.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          zip -r android-ui-checks.zip ui-check
          gh release create "$RELEASE_TAG" "$apk" android-ui-checks.zip --prerelease --latest=false --title "Android $version preview" --notes-file android/RELEASE-NOTES.md
